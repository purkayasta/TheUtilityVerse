<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title description">
  <title id="title">UtilityVerse — less boilerplate, more building.</title>
  <desc id="description">A dark engineering atlas connecting three C# packages: everyday utilities, generated copies, and HTTP helpers.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#26342f"/>
    </pattern>
  </defs>
  <rect width="1440" height="480" rx="24" fill="#101b17"/>
  <rect x="760" y="1" width="679" height="478" rx="24" fill="url(#grid)"/>
  <path d="M64 64H100" stroke="#d3f78a" stroke-width="4"/>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" letter-spacing="3">
    <text x="116" y="69" fill="#d3f78a">THE C# TOOLKIT</text>
    <text x="64" y="414" fill="#a9b9b0" letter-spacing="2">UTILITIES / OBJECT COPIES / HTTP</text>
  </g>
  <text x="57" y="207" fill="#f4f1e8" font-family="Arial, Helvetica, sans-serif" font-size="108" font-weight="800" letter-spacing="-6">UtilityVerse<tspan fill="#d3f78a">.</tspan></text>
  <text x="64" y="279" fill="#f4f1e8" font-family="Arial, Helvetica, sans-serif" font-size="33" letter-spacing="-1">Less boilerplate. More building.</text>
  <text x="64" y="324" fill="#a9b9b0" font-family="Arial, Helvetica, sans-serif" font-size="20">Three focused packages. One useful universe.</text>
  <g fill="none" stroke="#506758" stroke-width="1.5">
